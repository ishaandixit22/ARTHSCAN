<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="preload" href="%sveltekit.assets%/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/fonts/source-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#ffffff" />
    <script src="%sveltekit.assets%/theme.js"></script>
    <script src="%sveltekit.assets%/analytics.js" defer></script>
    %sveltekit.head%

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
