<!doctype html>
<html><head><meta charset="utf-8"><title>Canon</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; }
  body { width: 1440px; height: 900px; background: #fff; color: #111827; overflow: hidden; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 64px; border-bottom: 1px solid #e5e7eb; }
  .logo { font-weight: 700; font-size: 24px; color: #00a35c; }
  nav { display: flex; gap: 28px; font-size: 15px; color: #4b5563; }
  .hero { padding: 80px 64px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  h1 { font-size: 56px; line-height: 1.05; letter-spacing: -.02em; }
  p { font-size: 19px; color: #4b5563; margin: 18px 0 28px; max-width: 520px; }
  .btn { display: inline-block; background: #00a35c; color: #fff; padding: 14px 24px; border-radius: 10px; font-weight: 600; }
  .card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; height: 340px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 0 64px; }
  .cards div { border: 1px solid #e5e7eb; border-radius: 14px; height: 120px; padding: 18px; font-size: 26px; font-weight: 700; }
</style></head><body>
<header><div class="logo">arthscan</div><nav><span>Explore</span><span>Screener</span><span>IPOs</span><span>Learn</span></nav></header>
<section class="hero"><div><h1>Research Indian stocks, simply.</h1><p>Live prices, fundamentals and explanations for every NSE company.</p><span class="btn">Start exploring</span></div><div class="card"></div></section>
<section class="cards"><div>24,812</div><div>81,440</div><div>53,120</div><div>12.9</div></section>
</body></html>
